name: 问题反馈 / Bug report
description: 报告可复现问题，请勿提交凭据。 / Report a reproducible issue without credentials.
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: 系统与版本 / System and versions
      description: Windows / TeleVip Native / Telegram Desktop versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果 / Steps and actual behavior
      description: 请移除卡密、令牌与个人会话信息。 / Remove keys, tokens and private session data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与脱敏截图 / Expected behavior and redacted screenshots
